<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XML Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #fff;
            padding: 80px 100px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        input[type="file"] {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            max-width: 300px;
            cursor: pointer;
        }

        button {
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Upload XML File</h1>
    <input type="file" id="xmlFile" accept=".xml" required /><br>
    <button id="go">Upload & Edit</button>
</div>

<script>
    document.getElementById('go').addEventListener('click', async () => {
        const fileInput = document.getElementById('xmlFile');
        const file = fileInput.files[0];
        if (!file) return alert('Select a file');

        try {
            const sigRes = await fetch('https://zq0rjkggx0.execute-api.us-east-1.amazonaws.com/dev/generate-presigned-url');
            const { url: putUrl, key } = await sigRes.json();

            const put = await fetch(putUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/xml' },
                body: file
            });
            if (!put.ok) throw new Error('Upload failed');

            const proc = await fetch('https://zq0rjkggx0.execute-api.us-east-1.amazonaws.com/dev/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key })
            });

            const { downloadUrl } = await proc.json();


            if (downloadUrl) {
                window.open(downloadUrl, '_blank');
            } else {
                throw new Error('Download URL not returned');
            }

        } catch (err) {
            console.error(err);
            alert(err.message || 'Something went wrong');
        }
    });
</script>

</body>
</html>
